name = "mashru"
version = "0.1.0"
defaultTargets = ["Nabt", "SLGE", "Dal", "Madlul", "Jisr", "Aql", "Nizam", "faahis", "qari", "tahsil", "silsila", "athar", "tarkib", "rabt", "nabtBridge", "qanunJadwal"]

[[lean_lib]]
name = "Nabt"
globs = ["Nabt", "Nabt.+"]

[[lean_lib]]
name = "SLGE"
globs = ["SLGE.+"]

[[lean_lib]]
name = "Dal"
globs = ["Dal.+"]

[[lean_lib]]
name = "Madlul"
globs = ["Madlul.+"]

[[lean_lib]]
name = "Jisr"
globs = ["Jisr.+"]

[[lean_lib]]
name = "Aql"
globs = ["Aql.+"]

[[lean_lib]]
name = "Nizam"
globs = ["Nizam.+"]

[[lean_lib]]
name = "Faahis"
globs = ["Faahis.Lib", "Faahis.SijillMakhtum"]

[[lean_exe]]
name = "faahis"
root = "Faahis.Main"

[[lean_exe]]
name = "qari"
root = "Qari.Main"

[[lean_exe]]
name = "tahsil"
root = "Qari.Tahsil"

[[lean_exe]]
name = "silsila"
root = "Qari.Silsila"

[[lean_exe]]
name = "athar"
root = "Qari.Athar"

[[lean_exe]]
name = "tarkib"
root = "Qari.Tarkib"

[[lean_exe]]
name = "rabt"
root = "Qari.Rabt"

[[lean_exe]]
name = "nabtBridge"
root = "Jisr.NabtExport"

[[lean_exe]]
name = "qanunJadwal"
root = "Qari.QanunJadwal"
