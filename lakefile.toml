name = "mashru"
version = "0.1.0"
defaultTargets = ["SLGE", "Dal", "Madlul", "Jisr", "Aql", "Nizam", "faahis", "qari", "nabtBridge"]

[[require]]
name = "nabt"
path = "integrations/nabt/formal"

[[lean_lib]]
name = "SLGE"
globs = ["SLGE.+"]

[[lean_lib]]
name = "Dal"
globs = ["Dal.+"]

[[lean_lib]]
name = "Madlul"
globs = ["Madlul.+"]

[[lean_lib]]
name = "Jisr"
globs = ["Jisr.+"]

[[lean_lib]]
name = "Aql"
globs = ["Aql.+"]

[[lean_lib]]
name = "Nizam"
globs = ["Nizam.+"]

[[lean_lib]]
name = "Faahis"
globs = ["Faahis.Lib"]

[[lean_exe]]
name = "faahis"
root = "Faahis.Main"

[[lean_exe]]
name = "qari"
root = "Qari.Main"

[[lean_exe]]
name = "nabtBridge"
root = "Jisr.NabtExport"
